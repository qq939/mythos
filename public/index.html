<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYTHOS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0a0a0b;
    color: #c8c8c8;
    font-family: 'Georgia', 'Noto Serif SC', serif;
    line-height: 2;
    overflow: hidden;
    height: 100vh;
}

#novel-container {
    height: 100vh;
    overflow-y: auto;
    padding: 60px 80px 120px 80px;
    scroll-behavior: smooth;
}

#novel-container::-webkit-scrollbar {
    width: 3px;
}

#novel-container::-webkit-scrollbar-track {
    background: transparent;
}

#novel-container::-webkit-scrollbar-thumb {
    background: #222;
    border-radius: 2px;
}

#novel-title {
    max-width: 720px;
    margin: 0 auto 48px auto;
    text-align: center;
    color: #2a2a2a;
    font-size: 28px;
    letter-spacing: 18px;
    font-weight: normal;
    user-select: none;
}

#novel-text {
    max-width: 720px;
    margin: 0 auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 16.5px;
    letter-spacing: 0.3px;
}

#novel-text:empty::before {
    content: '';
    color: transparent;
}

/* Left side dots */
#dot-container {
    position: fixed;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 100;
}

.trigger-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a1a1a;
    cursor: pointer;
    transition: background 0.3s;
}

.trigger-dot:hover {
    background: #3a3a3a;
}

/* Modal overlay */
#modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    justify-content: center;
    align-items: center;
}

#modal-overlay.active {
    display: flex;
}

#modal {
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 32px;
    width: 520px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
}

#modal h3 {
    color: #666;
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
}

textarea.modal-input {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #222;
    border-radius: 2px;
    color: #aaa;
    font-family: 'Georgia', serif;
    font-size: 14px;
    line-height: 1.8;
    padding: 12px;
    resize: vertical;
    outline: none;
}

textarea.modal-input:focus {
    border-color: #333;
}

textarea.modal-input::placeholder {
    color: #333;
}

#prompt-input {
    height: 100px;
}

#system-prompt-input, #style-prompt-input {
    height: 300px;
    font-size: 12.5px;
    line-height: 1.6;
}

#modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
}

.btn {
    padding: 8px 24px;
    border: none;
    border-radius: 2px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
}

.btn-cancel {
    background: transparent;
    color: #444;
    border: 1px solid #222;
}

.btn-cancel:hover {
    color: #666;
    border-color: #333;
}

.btn-confirm {
    background: #1a1a1a;
    color: #888;
}

.btn-confirm:hover {
    background: #222;
    color: #aaa;
}

.btn-confirm:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

/* Version list */
#version-list {
    display: none;
    width: 100%;
}

#version-list.active {
    display: block;
}

.version-item {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #181818;
    transition: background 0.2s;
}

.version-item:hover {
    background: #181818;
}

.version-item:last-child {
    border-bottom: none;
}

.version-id {
    color: #666;
    font-size: 13px;
    letter-spacing: 1px;
    min-width: 80px;
}

.version-id.backup {
    color: #555;
    font-style: italic;
}

.version-meta {
    color: #333;
    font-size: 11px;
    margin-left: auto;
    letter-spacing: 0.5px;
}

#version-empty {
    color: #333;
    font-size: 12px;
    text-align: center;
    padding: 30px 0;
    font-style: italic;
}

/* Selection action buttons (delete + comment) */
#selection-actions {
    display: none;
    position: fixed;
    z-index: 250;
    gap: 1px;
    user-select: none;
}

#selection-actions.active {
    display: flex;
}

.sel-btn {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #666;
    padding: 5px 14px;
    font-family: 'Georgia', serif;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
}

.sel-btn:first-child {
    border-radius: 2px 0 0 2px;
}

.sel-btn:last-child {
    border-radius: 0 2px 2px 0;
}

.sel-btn:hover {
    background: #222;
    border-color: #444;
    color: #999;
}

.sel-btn.delete-btn:hover {
    background: #2a1a1a;
}

/* Delete confirm popup */
#delete-confirm {
    display: none;
    position: fixed;
    z-index: 260;
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 16px 20px;
    min-width: 200px;
}

#delete-confirm p {
    color: #666;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    line-height: 1.6;
}

#delete-confirm .confirm-btns {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

#delete-confirm .confirm-btns button {
    padding: 5px 16px;
    border: none;
    border-radius: 2px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
}

#delete-confirm .btn-no {
    background: transparent;
    color: #444;
    border: 1px solid #222;
}

#delete-confirm .btn-yes {
    background: #2a1a1a;
    color: #888;
    border: 1px solid #333;
}

#delete-confirm .btn-yes:hover {
    background: #3a1a1a;
    color: #aaa;
}

/* Comment inline dot */
.comment-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #333;
    cursor: pointer;
    vertical-align: middle;
    margin-left: 2px;
    margin-right: 1px;
    transition: background 0.3s;
}

.comment-dot:hover {
    background: #5a5a5a;
}

/* Comment create popup */
#comment-create-popup {
    display: none;
    position: fixed;
    z-index: 260;
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 16px 20px;
    min-width: 260px;
    max-width: 360px;
}

#comment-create-popup textarea {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #222;
    border-radius: 2px;
    color: #aaa;
    font-family: 'Georgia', serif;
    font-size: 13px;
    line-height: 1.7;
    padding: 10px;
    resize: vertical;
    outline: none;
    min-height: 80px;
}

#comment-create-popup textarea:focus {
    border-color: #333;
}

#comment-create-popup .popup-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 12px;
}

#comment-create-popup .popup-actions button {
    padding: 5px 16px;
    border: none;
    border-radius: 2px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
}

#comment-create-popup .btn-popup-cancel {
    background: transparent;
    color: #444;
    border: 1px solid #222;
}

#comment-create-popup .btn-popup-save {
    background: #1a1a1a;
    color: #888;
    border: 1px solid #333;
}

#comment-create-popup .btn-popup-save:hover {
    background: #222;
    color: #aaa;
}

/* Comment view popup */
#comment-view-popup {
    display: none;
    position: fixed;
    z-index: 270;
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 16px 20px;
    min-width: 260px;
    max-width: 360px;
}

#comment-view-popup .comment-snippet {
    color: #444;
    font-size: 11px;
    font-style: italic;
    margin-bottom: 10px;
    line-height: 1.5;
    max-height: 48px;
    overflow: hidden;
    word-break: break-all;
}

#comment-view-popup .comment-text {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 12px;
}

#comment-view-popup textarea {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #222;
    border-radius: 2px;
    color: #aaa;
    font-family: 'Georgia', serif;
    font-size: 13px;
    line-height: 1.7;
    padding: 10px;
    resize: vertical;
    outline: none;
    min-height: 80px;
}

#comment-view-popup textarea:focus {
    border-color: #333;
}

#comment-view-popup .popup-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

#comment-view-popup .popup-actions button {
    padding: 5px 16px;
    border: none;
    border-radius: 2px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
}

#comment-view-popup .btn-popup-edit {
    background: transparent;
    color: #666;
    border: 1px solid #222;
}

#comment-view-popup .btn-popup-edit:hover {
    color: #999;
    border-color: #333;
}

#comment-view-popup .btn-popup-delete {
    background: #1a1a1a;
    color: #666;
    border: 1px solid #333;
}

#comment-view-popup .btn-popup-delete:hover {
    background: #2a1a1a;
    color: #aaa;
}

#comment-view-popup .btn-popup-save {
    background: #1a1a1a;
    color: #888;
    border: 1px solid #333;
}

#comment-view-popup .btn-popup-save:hover {
    background: #222;
    color: #aaa;
}

#comment-view-popup .btn-popup-cancel {
    background: transparent;
    color: #444;
    border: 1px solid #222;
}

/* Loading indicator */
#loading {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #333;
    font-size: 12px;
    letter-spacing: 3px;
    z-index: 150;
}

#loading.active {
    display: block;
}

@keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
}

#loading span {
    animation: pulse 2s ease-in-out infinite;
}

/* New content highlight */
.new-content {
    color: #ddd;
    transition: color 3s ease;
}

.new-content.faded {
    color: #c8c8c8;
}

/* Toast notification */
#toast {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 12px;
    letter-spacing: 2px;
    z-index: 300;
}

#toast.active {
    display: block;
    animation: toastFade 2s ease forwards;
}

@keyframes toastFade {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
}
</style>
</head>
<body>

<div id="novel-container">
    <h1 id="novel-title">MYTHOS</h1>
    <div id="novel-text"></div>
</div>

<div id="dot-container">
    <div class="trigger-dot" id="dot-continue"></div>
    <div class="trigger-dot" id="dot-system"></div>
    <div class="trigger-dot" id="dot-style"></div>
    <div class="trigger-dot" id="dot-versions"></div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h3 id="modal-title">续写方向</h3>
        <textarea id="prompt-input" class="modal-input" placeholder="输入你想让故事发展的方向..."></textarea>
        <textarea id="system-prompt-input" class="modal-input" style="display:none" placeholder="系统提示词..."></textarea>
        <textarea id="style-prompt-input" class="modal-input" style="display:none" placeholder="粘贴一段你喜欢的文章，AI将模仿其风格续写..."></textarea>
        <div id="version-list"></div>
        <div id="modal-buttons">
            <button class="btn btn-cancel" id="btn-cancel">取消</button>
            <button class="btn btn-confirm" id="btn-confirm" style="display:none">确认</button>
        </div>
    </div>
</div>

<div id="loading"><span>正在续写...</span></div>
<div id="toast"></div>

<!-- Selection action buttons (delete + comment) -->
<div id="selection-actions">
    <div class="sel-btn delete-btn" id="delete-btn">删除</div>
    <div class="sel-btn" id="comment-btn">评论</div>
</div>

<!-- Delete confirm popup -->
<div id="delete-confirm">
    <p>确定删除选中的文字吗？</p>
    <div class="confirm-btns">
        <button class="btn-no" id="del-cancel">取消</button>
        <button class="btn-yes" id="del-confirm">删除</button>
    </div>
</div>

<!-- Comment create popup -->
<div id="comment-create-popup">
    <textarea id="comment-create-input" placeholder="写下你的评论..."></textarea>
    <div class="popup-actions">
        <button class="btn-popup-cancel" id="comment-create-cancel">取消</button>
        <button class="btn-popup-save" id="comment-create-save">保存</button>
    </div>
</div>

<!-- Comment view/edit/delete popup -->
<div id="comment-view-popup">
    <div class="comment-snippet" id="comment-view-snippet"></div>
    <div class="comment-text" id="comment-view-text"></div>
    <textarea id="comment-view-edit" style="display:none"></textarea>
    <div class="popup-actions" id="comment-view-actions">
        <button class="btn-popup-edit" id="comment-view-edit-btn">编辑</button>
        <button class="btn-popup-delete" id="comment-view-delete-btn">删除</button>
    </div>
    <div class="popup-actions" id="comment-edit-actions" style="display:none">
        <button class="btn-popup-cancel" id="comment-edit-cancel">取消</button>
        <button class="btn-popup-save" id="comment-edit-save">保存</button>
    </div>
</div>

<script>
const novelContainer = document.getElementById('novel-container');
const novelText = document.getElementById('novel-text');
const dotContinue = document.getElementById('dot-continue');
const dotSystem = document.getElementById('dot-system');
const dotStyle = document.getElementById('dot-style');
const dotVersions = document.getElementById('dot-versions');
const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const promptInput = document.getElementById('prompt-input');
const systemPromptInput = document.getElementById('system-prompt-input');
const stylePromptInput = document.getElementById('style-prompt-input');
const versionList = document.getElementById('version-list');
const btnCancel = document.getElementById('btn-cancel');
const btnConfirm = document.getElementById('btn-confirm');
const loading = document.getElementById('loading');
const toast = document.getElementById('toast');

// Selection actions
const selectionActions = document.getElementById('selection-actions');
const deleteBtn = document.getElementById('delete-btn');
const commentBtn = document.getElementById('comment-btn');
const deleteConfirm = document.getElementById('delete-confirm');
const delCancel = document.getElementById('del-cancel');
const delConfirmBtn = document.getElementById('del-confirm');

// Comment popups
const commentCreatePopup = document.getElementById('comment-create-popup');
const commentCreateInput = document.getElementById('comment-create-input');
const commentCreateCancel = document.getElementById('comment-create-cancel');
const commentCreateSave = document.getElementById('comment-create-save');
const commentViewPopup = document.getElementById('comment-view-popup');
const commentViewSnippet = document.getElementById('comment-view-snippet');
const commentViewText = document.getElementById('comment-view-text');
const commentViewEdit = document.getElementById('comment-view-edit');
const commentViewActions = document.getElementById('comment-view-actions');
const commentEditActions = document.getElementById('comment-edit-actions');
const commentViewEditBtn = document.getElementById('comment-view-edit-btn');
const commentViewDeleteBtn = document.getElementById('comment-view-delete-btn');
const commentEditCancel = document.getElementById('comment-edit-cancel');
const commentEditSave = document.getElementById('comment-edit-save');

let isGenerating = false;
let previousLength = 0;
let currentModalMode = null;
let selectedText = '';
let allComments = [];
let currentViewComment = null;

// --- Utility ---

function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
}

function scrollToBottom() {
    novelContainer.scrollTop = novelContainer.scrollHeight;
}

// --- Novel rendering with comment dots ---

function renderNovel(text) {
    if (!allComments || allComments.length === 0) {
        novelText.textContent = text;
        return;
    }

    // Find positions of commented text in the novel
    const markers = [];
    for (const c of allComments) {
        const idx = text.indexOf(c.text);
        if (idx !== -1) {
            markers.push({ id: c.id, start: idx, end: idx + c.text.length });
        }
    }

    // Sort by position ascending, skip overlapping
    markers.sort((a, b) => a.start - b.start);
    const nonOverlapping = [];
    let lastEnd = -1;
    for (const m of markers) {
        if (m.start >= lastEnd) {
            nonOverlapping.push(m);
            lastEnd = m.end;
        }
    }

    // Build HTML with comment dots
    let html = '';
    let pos = 0;
    for (const m of nonOverlapping) {
        if (m.start > pos) {
            html += escapeHtml(text.substring(pos, m.start));
        }
        html += escapeHtml(text.substring(m.start, m.end));
        html += `<span class="comment-dot" data-comment-id="${m.id}"></span>`;
        pos = m.end;
    }
    html += escapeHtml(text.substring(pos));

    novelText.innerHTML = html;

    // Add click handlers to dots
    novelText.querySelectorAll('.comment-dot').forEach(dot => {
        dot.addEventListener('click', (e) => {
            e.stopPropagation();
            const commentId = dot.dataset.commentId;
            const comment = allComments.find(c => c.id === commentId);
            if (comment) showCommentView(dot, comment);
        });
    });
}

// --- API calls ---

async function loadNovel() {
    try {
        const resp = await fetch('/api/novel');
        const text = await resp.text();
        renderNovel(text);
        return text.length;
    } catch (e) { return 0; }
}

async function loadComments() {
    try {
        const resp = await fetch('/api/comments');
        const data = await resp.json();
        allComments = data.comments || [];
    } catch (e) { allComments = []; }
}

async function loadSystemPrompt() {
    try {
        const resp = await fetch('/api/system-prompt');
        return await resp.text();
    } catch (e) { return ''; }
}

async function loadStylePrompt() {
    try {
        const resp = await fetch('/api/style-prompt');
        return await resp.text();
    } catch (e) { return ''; }
}

async function continueNovel(userPrompt) {
    if (isGenerating) return;
    isGenerating = true;
    btnConfirm.disabled = true;
    loading.classList.add('active');

    try {
        const resp = await fetch('/api/continue', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userPrompt })
        });

        const data = await resp.json();

        if (data.success) {
            previousLength = novelText.textContent.length;
            await loadNovel();
            scrollToBottom();
        } else {
            alert('续写失败: ' + (data.error || '未知错误'));
        }
    } catch (e) {
        alert('请求失败: ' + e.message);
    } finally {
        isGenerating = false;
        btnConfirm.disabled = false;
        loading.classList.remove('active');
    }
}

async function saveSystemPrompt(prompt) {
    btnConfirm.disabled = true;
    try {
        const resp = await fetch('/api/system-prompt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });
        const data = await resp.json();
        if (data.success) showToast('系统提示词已保存');
        else alert('保存失败: ' + (data.error || '未知错误'));
    } catch (e) { alert('请求失败: ' + e.message); }
    finally { btnConfirm.disabled = false; }
}

async function saveStylePrompt(prompt) {
    btnConfirm.disabled = true;
    try {
        const resp = await fetch('/api/style-prompt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });
        const data = await resp.json();
        if (data.success) showToast('风格提示词已保存');
        else alert('保存失败: ' + (data.error || '未知错误'));
    } catch (e) { alert('请求失败: ' + e.message); }
    finally { btnConfirm.disabled = false; }
}

async function deleteText(text) {
    try {
        const resp = await fetch('/api/delete-text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        const data = await resp.json();
        if (data.success) {
            await loadNovel();
            showToast('已删除');
        } else {
            alert('删除失败: ' + (data.error || '未知错误'));
        }
    } catch (e) {
        alert('请求失败: ' + e.message);
    }
}

async function createComment(text, comment) {
    try {
        const resp = await fetch('/api/comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, comment })
        });
        const data = await resp.json();
        if (data.success) {
            await loadComments();
            await loadNovel();
            showToast('评论已保存');
        } else {
            alert('保存失败: ' + (data.error || '未知错误'));
        }
    } catch (e) {
        alert('请求失败: ' + e.message);
    }
}

async function updateComment(id, comment) {
    try {
        const resp = await fetch('/api/comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, text: currentViewComment.text, comment })
        });
        const data = await resp.json();
        if (data.success) {
            await loadComments();
            await loadNovel();
            showToast('评论已更新');
        } else {
            alert('更新失败: ' + (data.error || '未知错误'));
        }
    } catch (e) {
        alert('请求失败: ' + e.message);
    }
}

async function deleteComment(id) {
    try {
        const resp = await fetch('/api/comment/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        const data = await resp.json();
        if (data.success) {
            await loadComments();
            await loadNovel();
            showToast('评论已删除');
        } else {
            alert('删除失败: ' + (data.error || '未知错误'));
        }
    } catch (e) {
        alert('请求失败: ' + e.message);
    }
}

async function loadVersions() {
    try {
        const resp = await fetch('/api/versions');
        const data = await resp.json();
        return data.versions || [];
    } catch (e) { return []; }
}

async function rollbackTo(version) {
    if (!confirm(`回退到 ${version}？当前内容将被替换。`)) return;
    try {
        const resp = await fetch('/api/rollback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ version })
        });
        const data = await resp.json();
        if (data.success) {
            await loadNovel();
            closeModal();
            showToast(`已回退到 ${version}`);
        } else {
            alert('回退失败: ' + (data.error || '未知错误'));
        }
    } catch (e) { alert('请求失败: ' + e.message); }
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    return (bytes / 1024).toFixed(1) + ' KB';
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// --- Modal ---

function openModal(mode) {
    currentModalMode = mode;
    promptInput.style.display = 'none';
    systemPromptInput.style.display = 'none';
    stylePromptInput.style.display = 'none';
    versionList.classList.remove('active');
    versionList.innerHTML = '';
    btnConfirm.style.display = 'none';

    if (mode === 'continue') {
        modalTitle.textContent = '续写方向';
        promptInput.style.display = '';
        btnConfirm.style.display = '';
        promptInput.value = '';
        setTimeout(() => promptInput.focus(), 100);
    } else if (mode === 'system-prompt') {
        modalTitle.textContent = '系统提示词';
        systemPromptInput.style.display = '';
        btnConfirm.style.display = '';
        loadSystemPrompt().then(text => {
            systemPromptInput.value = text;
            setTimeout(() => systemPromptInput.focus(), 100);
        });
    } else if (mode === 'style-prompt') {
        modalTitle.textContent = '风格提示词';
        stylePromptInput.style.display = '';
        btnConfirm.style.display = '';
        loadStylePrompt().then(text => {
            stylePromptInput.value = text;
            setTimeout(() => stylePromptInput.focus(), 100);
        });
    } else if (mode === 'versions') {
        modalTitle.textContent = '版本历史';
        versionList.classList.add('active');
        loadVersions().then(versions => {
            if (versions.length === 0) {
                versionList.innerHTML = '<div id="version-empty">暂无版本记录</div>';
                return;
            }
            versionList.innerHTML = versions.map(v => `
                <div class="version-item" data-version="${v.id}">
                    <span class="version-id ${v.id === 'vBACKUP' ? 'backup' : ''}">${v.id}</span>
                    <span class="version-meta">${formatSize(v.size)} · ${formatDate(v.mtime)}</span>
                </div>
            `).join('');
            versionList.querySelectorAll('.version-item').forEach(item => {
                item.addEventListener('click', () => rollbackTo(item.dataset.version));
            });
        });
    }
    modalOverlay.classList.add('active');
}

function closeModal() {
    modalOverlay.classList.remove('active');
    currentModalMode = null;
}

// --- Selection actions (delete + comment) ---

function hideSelectionUI() {
    selectionActions.classList.remove('active');
    deleteConfirm.style.display = 'none';
    commentCreatePopup.style.display = 'none';
    selectedText = '';
}

function showSelectionActions(x, y) {
    let btnX = x;
    let btnY = y - 36;
    if (btnX + 130 > window.innerWidth) btnX = window.innerWidth - 130;
    if (btnX < 10) btnX = 10;
    if (btnY < 10) btnY = y + 20;
    selectionActions.style.left = btnX + 'px';
    selectionActions.style.top = btnY + 'px';
    selectionActions.classList.add('active');
}

novelContainer.addEventListener('mouseup', function(e) {
    setTimeout(() => {
        const sel = window.getSelection();
        const text = sel.toString().trim();
        if (text && text.length > 0 && novelText.contains(sel.anchorNode)) {
            selectedText = text;
            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            showSelectionActions(rect.right, rect.top);
        } else {
            if (!selectionActions.contains(e.target) && !deleteConfirm.contains(e.target) && !commentCreatePopup.contains(e.target)) {
                hideSelectionUI();
            }
        }
    }, 10);
});

novelContainer.addEventListener('touchend', function(e) {
    setTimeout(() => {
        const sel = window.getSelection();
        const text = sel.toString().trim();
        if (text && text.length > 0 && novelText.contains(sel.anchorNode)) {
            selectedText = text;
            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            showSelectionActions(rect.right, rect.top);
        }
    }, 300);
});

// Delete flow
deleteBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!selectedText) return;
    const btnRect = selectionActions.getBoundingClientRect();
    let popY = btnRect.top - 80;
    if (popY < 10) popY = btnRect.bottom + 5;
    deleteConfirm.style.left = btnRect.left + 'px';
    deleteConfirm.style.top = popY + 'px';
    deleteConfirm.style.display = 'block';
    selectionActions.classList.remove('active');
});

delCancel.addEventListener('click', function(e) {
    e.stopPropagation();
    hideSelectionUI();
});

delConfirmBtn.addEventListener('click', async function(e) {
    e.stopPropagation();
    if (!selectedText) return;
    const textToDelete = selectedText;
    deleteConfirm.style.display = 'none';
    window.getSelection().removeAllRanges();
    await deleteText(textToDelete);
    selectedText = '';
});

// Comment create flow
commentBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!selectedText) return;
    const btnRect = selectionActions.getBoundingClientRect();
    let popY = btnRect.top - 140;
    if (popY < 10) popY = btnRect.bottom + 5;
    commentCreatePopup.style.left = btnRect.left + 'px';
    commentCreatePopup.style.top = popY + 'px';
    commentCreateInput.value = '';
    commentCreatePopup.style.display = 'block';
    selectionActions.classList.remove('active');
    setTimeout(() => commentCreateInput.focus(), 100);
});

commentCreateCancel.addEventListener('click', function(e) {
    e.stopPropagation();
    hideSelectionUI();
});

commentCreateSave.addEventListener('click', async function(e) {
    e.stopPropagation();
    const comment = commentCreateInput.value.trim();
    if (!comment || !selectedText) return;
    commentCreatePopup.style.display = 'none';
    window.getSelection().removeAllRanges();
    await createComment(selectedText, comment);
    selectedText = '';
});

commentCreateInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        commentCreateSave.click();
    }
});

// --- Comment view/edit/delete ---

function showCommentView(dotEl, comment) {
    currentViewComment = comment;
    commentViewSnippet.textContent = comment.text.length > 80 ? comment.text.substring(0, 80) + '...' : comment.text;
    commentViewText.textContent = comment.comment;
    commentViewText.style.display = '';
    commentViewEdit.style.display = 'none';
    commentViewActions.style.display = '';
    commentEditActions.style.display = 'none';

    const rect = dotEl.getBoundingClientRect();
    let popX = rect.left + 10;
    let popY = rect.bottom + 5;
    if (popX + 360 > window.innerWidth) popX = window.innerWidth - 370;
    if (popX < 10) popX = 10;
    if (popY + 200 > window.innerHeight) popY = rect.top - 200;
    commentViewPopup.style.left = popX + 'px';
    commentViewPopup.style.top = popY + 'px';
    commentViewPopup.style.display = 'block';
}

function hideCommentView() {
    commentViewPopup.style.display = 'none';
    currentViewComment = null;
}

commentViewEditBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!currentViewComment) return;
    commentViewText.style.display = 'none';
    commentViewEdit.value = currentViewComment.comment;
    commentViewEdit.style.display = '';
    commentViewActions.style.display = 'none';
    commentEditActions.style.display = '';
    setTimeout(() => commentViewEdit.focus(), 100);
});

commentViewDeleteBtn.addEventListener('click', async function(e) {
    e.stopPropagation();
    if (!currentViewComment) return;
    hideCommentView();
    await deleteComment(currentViewComment.id);
});

commentEditCancel.addEventListener('click', function(e) {
    e.stopPropagation();
    commentViewText.style.display = '';
    commentViewEdit.style.display = 'none';
    commentViewActions.style.display = '';
    commentEditActions.style.display = 'none';
});

commentEditSave.addEventListener('click', async function(e) {
    e.stopPropagation();
    if (!currentViewComment) return;
    const newComment = commentViewEdit.value.trim();
    if (!newComment) return;
    hideCommentView();
    await updateComment(currentViewComment.id, newComment);
});

commentViewEdit.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        commentEditSave.click();
    }
});

// --- Global click handlers ---

document.addEventListener('mousedown', function(e) {
    if (!selectionActions.contains(e.target) && !deleteConfirm.contains(e.target) && !commentCreatePopup.contains(e.target)) {
        hideSelectionUI();
    }
    if (!commentViewPopup.contains(e.target) && !e.target.classList.contains('comment-dot')) {
        hideCommentView();
    }
});

// --- Dot and modal event listeners ---

dotContinue.addEventListener('click', () => { if (!isGenerating) openModal('continue'); });
dotSystem.addEventListener('click', () => { openModal('system-prompt'); });
dotStyle.addEventListener('click', () => { openModal('style-prompt'); });
dotVersions.addEventListener('click', () => { openModal('versions'); });

btnCancel.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

btnConfirm.addEventListener('click', () => {
    if (currentModalMode === 'continue') {
        const prompt = promptInput.value.trim();
        if (!prompt) return;
        closeModal();
        continueNovel(prompt);
    } else if (currentModalMode === 'system-prompt') {
        const prompt = systemPromptInput.value.trim();
        if (!prompt) return;
        closeModal();
        saveSystemPrompt(prompt);
    } else if (currentModalMode === 'style-prompt') {
        const prompt = stylePromptInput.value.trim();
        closeModal();
        saveStylePrompt(prompt);
    }
});

promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btnConfirm.click(); }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// --- Init ---
loadComments().then(() => loadNovel()).then(() => scrollToBottom());
</script>
